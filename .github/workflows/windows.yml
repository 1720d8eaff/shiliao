name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test synthetic history and isolated launch parameters
        run: python -m unittest discover -s tests -v
      - name: Test native GUI
        run: python desktop.pyw --self-test --data-dir "$env:RUNNER_TEMP/shiliao-native-test"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows release
        run: python scripts/build_windows.py
      - name: Test frozen entrypoints
        run: python scripts/smoke_release.py --data-dir "$env:RUNNER_TEMP/shiliao-frozen-test"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shiliao-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
