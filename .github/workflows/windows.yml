name: Windows checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test synthetic history and isolated launch parameters
        run: python -m unittest discover -s tests -v
      - name: Test native GUI
        run: python desktop.pyw --self-test --data-dir "$env:RUNNER_TEMP/shiliao-native-test"
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows release
        run: python scripts/build_windows.py
      - name: Test frozen entrypoints
        run: python scripts/smoke_release.py --data-dir "$env:RUNNER_TEMP/shiliao-frozen-test"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Shiliao-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
